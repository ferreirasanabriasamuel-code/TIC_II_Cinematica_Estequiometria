  <!-- Modo claro/oscuro: aplica la preferencia guardada ANTES del primer
       render (localStorage 'tp-ciencias-modo'; sin preferencia, la del
       sistema). El interruptor vive en la barra superior de la página. -->
  <script>
    (function () {
      try {
        var modo = window.localStorage.getItem('tp-ciencias-modo');
        if (!modo) {
          modo = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'oscuro' : 'claro';
        }
        if (modo === 'oscuro') document.documentElement.setAttribute('data-modo', 'oscuro');
      } catch (e) { /* sin almacenamiento: se queda en modo claro */ }
    })();
  </script>
